[package]
name = "client"
version = "0.1.0"
edition = "2021"

[dependencies]
anchor-client = "0.31.1"
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", features = ["metadata"] }
anyhow = "1.0.32"
proc-macro2 = "1.0.94"
pyth-sdk-solana = "0.10.4"
raydium-amm-v3 = {path = "../programs/amm", features = ["no-entrypoint", "client"]}
solana-sdk = { version = "2.2.2", features = ["full"] }
spl-memo = "6.0.0"
uint = { git = "https://github.com/raydium-io/parity-common", package = "uint" }
mpl-token-metadata = "5.1.0"
arrayref = "0.3.9"
clap = { version = "4.5.38", features = ["derive"] }
configparser = "3.1.0"
rand = "0.9.1"
serde_json = { version = "1.0.140" }
bincode = { version = "2.0.1" }
solana-transaction-status = "2.2.7"
spl-token-client = "0.15.0"
colorful = "0.3.2"
regex = "1.11.1"
hex = "0.4.3"
